upstream auth_service { server auth-service:3001; }
upstream store_service { server store-service:3002; }
upstream catalog_service { server catalog-service:3003; }
upstream order_service { server order-service:3004; }
upstream seller_service { server seller-service:3005; }
upstream user_service { server user-service:3006; }
upstream analytics_service { server analytics-service:3007; }

server {
    listen 8080;
    client_max_body_size 20M;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Session-Id" always;
    add_header Access-Control-Allow-Credentials true always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location /api/auth/ {
        proxy_pass http://auth_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/stores/ {
        proxy_pass http://store_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/catalog/ {
        proxy_pass http://catalog_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/orders/ {
        proxy_pass http://order_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Session-Id $http_x_session_id;
    }

    location /api/sellers/ {
        proxy_pass http://seller_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/users/ {
        proxy_pass http://user_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Session-Id $http_x_session_id;
    }

    location /api/analytics/ {
        proxy_pass http://analytics_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
