name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - store-service
          - catalog-service
          - order-service
          - seller-service
          - user-service
          - analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/services/${{ matrix.service }}/package-lock.json
      - name: Unit tests ${{ matrix.service }}
        working-directory: backend/services/${{ matrix.service }}
        run: |
          npm ci
          npm run test:unit
          rm -f tsconfig.build.tsbuildinfo
          npm run build

  backend-integration:
    runs-on: ubuntu-latest
    needs: backend-unit
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - store-service
          - catalog-service
          - order-service
          - seller-service
          - user-service
          - analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/services/${{ matrix.service }}/package-lock.json
      - name: Integration tests ${{ matrix.service }}
        working-directory: backend/services/${{ matrix.service }}
        run: |
          npm ci
          npm run test:integration

  frontend-web:
    runs-on: ubuntu-latest
    needs: backend-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - uses: browser-actions/setup-chrome@v1
      - name: Unit tests and build Angular
        working-directory: frontend/web
        run: |
          npm ci
          npm run test:unit
          npm run build

  frontend-mobile:
    runs-on: ubuntu-latest
    needs: backend-unit
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unit tests and analyze Flutter
        working-directory: frontend/mobile
        run: |
          flutter pub get
          flutter test test/unit
          flutter analyze --no-fatal-infos --no-fatal-warnings
