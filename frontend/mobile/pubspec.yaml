name: myshop_mobile
description: MyShop marketplace mobile app - client, vendeur, manager
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  go_router: ^14.6.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  intl: ^0.20.1
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  image_picker: ^1.2.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon.png
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
